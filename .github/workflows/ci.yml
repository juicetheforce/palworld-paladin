name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: validate settings key list
        run: python3 -m json.tool data/palworld-settings.json > /dev/null
